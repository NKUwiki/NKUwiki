packages:
  - packages/*

# hoisted 布局：包实体直接落盘，不依赖符号链接。
# pnpm 12（Rust 版）在无开发者模式权限的 Windows 环境下创建符号链接会静默失败
# （只留空目录，2026-10-15 事故根因），hoisted 在任何环境下都可安装
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  unrs-resolver: true

engineStrict: true
shellEmulator: true
# 关闭跑脚本前的依赖自动校验/重链：本机 node_modules 的 workspace 链接
# 由手工维护（无符号链接权限时 pnpm 12 重链会静默失败只留空目录），
# 自动重链反而会把可用链接破坏掉（2026-10-15）
verifyDepsBeforeRun: false
