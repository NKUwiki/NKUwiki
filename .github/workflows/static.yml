name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  # 连续 push 时取消仍在跑的旧构建：Pages 部署以最后一次 push 为准，
  # 排队跑完中间提交只会让旧版本先上线再被覆盖，白耗 runner 时长
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types, style and content index
        run: pnpm check

      - name: Build VitePress site
        run: pnpm build
        # 站点级构建变量写在 docs/.env（VitePress 从 srcDir 读取），随仓库分发。
        # 这里不要写 ${{ secrets.* }} 传同名变量：secret 未配置时值是空串，而
        # process.env 里的 VITE_ 变量优先级高于 .env 文件，空串会把已配置的
        # 地址覆盖掉、功能被静默关闭（Twikoo 评论区就曾因此不上线）。
        # 需要保密的值才配 secret，且必须确保该 secret 已填写。

      - name: Upload built site to artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
