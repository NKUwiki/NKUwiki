name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  # 连续 push 时取消仍在跑的旧构建：Pages 部署以最后一次 push 为准，
  # 排队跑完中间提交只会让旧版本先上线再被覆盖，白耗 runner 时长
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # 图片/媒体资源外链到 R2 图床（config.mts 读 process.env，不读 docs/.env）。
    # 删掉这一行即完整回退为 Pages 直出（产物逐字节还原），是全站唯一的开关；
    # 下面的构建与「图床验活」共用它。
    # 必须放在这里而不是 docs/.env：.env 只喂 VITE_ 前缀、且只进 import.meta.env，
    # 而 config.mts 读的是 process.env，写进 .env 会被静默忽略、构建照常成功但功能没开。
    # 也不要改成 ${{ secrets.* }}：secret 未配置时值是空串，空串会把已配置的地址
    # 覆盖掉、功能被静默关闭（Twikoo 评论区就曾因此不上线）。
    env:
      WIKI_ASSETS_BASE: https://img.freshnkuer.wiki

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types, style and content index
        run: pnpm check

      # 可选：配了 CLOUDFLARE_API_TOKEN 就把 docs/public 全量镜像进桶，加图不必再手动补传。
      # 没配则跳过，缺图交给下一步的验活兜住（那时加图的人要自己 mirror 一次）。
      # PR 不跑：fork 拿不到 secret，且不该让未合并的分支改写生产桶。
      - name: Mirror docs/public into R2 bucket
        if: github.event_name != 'pull_request'
        working-directory: image-uploader
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过自动镜像（缺图会被下一步的验活拦下）"
            exit 0
          fi
          npm ci --no-audit --no-fund
          node scripts/mirror-public.mjs

      - name: Build VitePress site
        run: pnpm build

      # 部署前闸门：产物里每个图床地址都 HEAD 一次，取不到就不上传、线上保持旧版本。
      # 为什么必须有：插件是无条件改写，仓库有图、桶里没同步时构建不会报错，
      # 本地 dev 也不经过插件（apply: 'build'），只有线上 404。
      # main 分支硬失败；PR 只打 warning（贡献者没有桶的写权限）。
      - name: Verify every CDN asset resolves
        env:
          CHECK_CDN_STRICT: ${{ github.event_name != 'pull_request' }}
        run: node docs/.vitepress/scripts/check-cdn-assets.mjs docs/.vitepress/dist

      - name: Upload built site to artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
